[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyne"
version = "0.1.0"
description = "Interactive terminal app teaching Python to Cisco network engineers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hector Garcia", email = "21garcia21@gmail.com" }]
keywords = ["cisco", "network", "automation", "python", "training", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: System :: Networking",
]
dependencies = [
    "textual>=0.50",
    "rich>=13",
    "PyYAML>=6",
    "python-dotenv>=1",
    "netmiko>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "textual-dev>=1",
]

[project.scripts]
pyne = "pyne.__main__:main"

[project.urls]
Homepage = "https://github.com/ihave0billion/python-for-network-engineers"
Repository = "https://github.com/ihave0billion/python-for-network-engineers"

[tool.setuptools]
packages = ["pyne"]

[tool.ruff]
line-length = 88
target-version = "py310"
